<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan & Collaborative Development</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a192f 0%, #112240 100%);
            color: #ccd6f6;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 4rem;
            z-index: 10;
            position: relative;
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
            justify-content: center;
        }

        .title-icon {
            font-size: 3rem;
            color: #64ffda;
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #64ffda;
            text-shadow: 0 0 20px rgba(100, 255, 218, 0.3);
        }

        .main-description {
            background: rgba(17, 34, 64, 0.6);
            border-left: 4px solid #64ffda;
            border-radius: 12px;
            padding: 2rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 3rem;
            text-align: center;
        }

        .description {
            font-size: 1.4rem;
            line-height: 1.8;
            color: #8892b0;
        }

        .keyword {
            color: #64ffda;
            font-weight: 600;
        }

        .evolution-section {
            background: rgba(100, 255, 218, 0.05);
            border: 2px solid rgba(100, 255, 218, 0.3);
            border-radius: 12px;
            padding: 2.5rem;
            margin-bottom: 2rem;
        }

        .evolution-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: #64ffda;
            margin-bottom: 2rem;
            text-align: center;
        }

        .evolution-content {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #8892b0;
            text-align: center;
        }

        .representative-section {
            background: rgba(17, 34, 64, 0.8);
            border: 2px solid #64ffda;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
        }

        .representative-label {
            font-size: 1.3rem;
            font-weight: 600;
            color: #8892b0;
            margin-bottom: 1rem;
        }

        .representative-name {
            font-size: 2.5rem;
            font-weight: 700;
            color: #64ffda;
            text-shadow: 0 0 20px rgba(100, 255, 218, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .cursor-logo {
            font-size: 2.5rem;
        }

        .timeline {
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin: 3rem 0;
            position: relative;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 10%;
            right: 10%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #64ffda, transparent);
        }

        .timeline-item {
            background: rgba(17, 34, 64, 0.8);
            border: 2px solid rgba(100, 255, 218, 0.3);
            border-radius: 12px;
            padding: 1.5rem;
            width: 200px;
            text-align: center;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .timeline-item:hover {
            transform: translateY(-10px);
            border-color: #64ffda;
            box-shadow: 0 10px 30px rgba(100, 255, 218, 0.3);
        }

        .timeline-stage {
            font-size: 1.1rem;
            font-weight: 600;
            color: #64ffda;
            margin-bottom: 0.5rem;
        }

        .timeline-desc {
            font-size: 0.9rem;
            color: #8892b0;
        }

        .evolution-arrow {
            font-size: 2rem;
            color: #64ffda;
        }

        .turning-point {
            position: absolute;
            top: 50px;
            right: 100px;
            background: rgba(100, 255, 218, 0.1);
            border: 2px solid #64ffda;
            border-radius: 20px;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: #64ffda;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 10px rgba(100, 255, 218, 0.3);
            }
            50% {
                box-shadow: 0 0 25px rgba(100, 255, 218, 0.6);
            }
        }
    </style>
</head>
<body>
    <!-- Turning Point Badge -->
    <div class="turning-point">
        <i class="fas fa-star"></i> 转折点
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="title-wrapper">
            <i class="fas fa-tasks title-icon"></i>
            <h1>Plan & 协作开发</h1>
        </div>

        <div class="main-description">
            <div class="description">
                对应 <span class="keyword">「Vibe Specs」</span> 阶段。Plan 的本质也是先生成规格文档，确认后再开始开发。
            </div>
        </div>

        <div class="timeline">
            <div class="timeline-item">
                <div class="timeline-stage">阶段 1-3</div>
                <div class="timeline-desc">工具驱动人</div>
            </div>

            <i class="fas fa-arrow-right evolution-arrow"></i>

            <div class="timeline-item" style="border-color: #64ffda; background: rgba(100, 255, 218, 0.1);">
                <div class="timeline-stage">阶段 4+</div>
                <div class="timeline-desc">人驱动工具</div>
            </div>
        </div>

        <div class="evolution-section">
            <div class="evolution-title">从这个阶段开始：人驱动工具进化</div>
            <div class="evolution-content">
                在 Plan 模式出现之前，人们已经开始使用规则实现 <span class="keyword">「Vibe Specs」</span>。Plan 模式的出现是 IDE 在用户实践推动下的进化结果。
            </div>
        </div>

        <div class="representative-section">
            <div class="representative-label">代表：</div>
            <div class="representative-name">
                <i class="fas fa-mouse-pointer cursor-logo"></i>
                <span>Cursor Plan 模式</span>
            </div>
        </div>
    </div>
</body>
</html>
