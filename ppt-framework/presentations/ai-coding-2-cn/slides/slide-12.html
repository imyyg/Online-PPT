<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent & Code Generation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a192f 0%, #112240 100%);
            color: #ccd6f6;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem;
            z-index: 10;
            position: relative;
        }

        .title-wrapper {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
            justify-content: center;
        }

        .title-icon {
            font-size: 3rem;
            color: #64ffda;
            animation: iconFloat 3s ease-in-out infinite;
        }

        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-10px) rotate(5deg);
            }
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #64ffda;
            text-shadow: 0 0 20px rgba(100, 255, 218, 0.3);
        }

        .content-section {
            text-align: center;
            margin-bottom: 3rem;
        }

        .description-box {
            background: rgba(17, 34, 64, 0.6);
            border-left: 4px solid #64ffda;
            border-radius: 12px;
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            margin: 0 auto;
        }

        .description {
            font-size: 1.5rem;
            line-height: 2;
            color: #8892b0;
        }

        .keyword {
            color: #64ffda;
            font-weight: 600;
        }

        .flow-diagram {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            margin-top: 3rem;
        }

        .flow-card {
            background: rgba(17, 34, 64, 0.8);
            border: 2px solid rgba(100, 255, 218, 0.3);
            border-radius: 12px;
            padding: 2rem;
            width: 250px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }

        .flow-card:hover {
            transform: translateY(-10px);
            border-color: #64ffda;
            box-shadow: 0 15px 40px rgba(100, 255, 218, 0.3);
        }

        .flow-icon {
            font-size: 3rem;
            color: #64ffda;
            margin-bottom: 1rem;
        }

        .flow-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ccd6f6;
            margin-bottom: 0.8rem;
        }

        .flow-desc {
            font-size: 1rem;
            color: #8892b0;
            line-height: 1.6;
        }

        .flow-arrow {
            font-size: 2.5rem;
            color: #64ffda;
            animation: arrowPulse 2s ease-in-out infinite;
        }

        @keyframes arrowPulse {
            0%, 100% {
                transform: translateX(0);
                opacity: 0.6;
            }
            50% {
                transform: translateX(10px);
                opacity: 1;
            }
        }

        .stage-badge {
            display: inline-block;
            background: rgba(100, 255, 218, 0.2);
            color: #64ffda;
            padding: 0.8rem 2rem;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            border: 2px solid #64ffda;
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.3);
            margin-top: 3rem;
        }

        .robot-animation {
            position: absolute;
            bottom: 50px;
            right: 100px;
            font-size: 8rem;
            color: #64ffda;
            opacity: 0.1;
            animation: robotWork 3s ease-in-out infinite;
        }

        @keyframes robotWork {
            0%, 100% {
                transform: rotate(-5deg);
            }
            50% {
                transform: rotate(5deg);
            }
        }
    </style>
</head>
<body>
    <!-- Robot Animation -->
    <div class="robot-animation">
        <i class="fas fa-robot"></i>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="title-wrapper">
            <i class="fas fa-robot title-icon"></i>
            <h1>Agent & Code Generation</h1>
        </div>

        <div class="content-section">
            <div class="description-box">
                <div class="description">
                    对应 <span class="keyword">「Vibe Coding」</span> 阶段。正是因为 IDE 具有 Agent 模式，支持自动生成代码，才有了 <span class="keyword">「Vibe Coding」</span> 的基础。
                </div>
            </div>
        </div>

        <div class="flow-diagram">
            <div class="flow-card">
                <i class="fas fa-comment-dots flow-icon"></i>
                <div class="flow-title">模糊 Prompt</div>
                <div class="flow-desc">简短、简单的指令</div>
            </div>

            <i class="fas fa-arrow-right flow-arrow"></i>

            <div class="flow-card">
                <i class="fas fa-robot flow-icon"></i>
                <div class="flow-title">Agent 模式</div>
                <div class="flow-desc">AI 自主处理</div>
            </div>

            <i class="fas fa-arrow-right flow-arrow"></i>

            <div class="flow-card">
                <i class="fas fa-code flow-icon"></i>
                <div class="flow-title">代码生成</div>
                <div class="flow-desc">完整实现</div>
            </div>
        </div>

        <div style="text-align: center;">
            <div class="stage-badge">Vibe Coding 时代</div>
        </div>
    </div>
</body>
</html>
